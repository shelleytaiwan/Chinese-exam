<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文檢定備考</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% -10%, #fffdf8 0%, #f6f4ef 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .page {
      width: min(1120px, 100%);
      max-width: 1120px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      color: #8e652f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1.2;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      margin-top: 14px;
      color: #9a9186;
      font-size: 16px;
      letter-spacing: 0.05em;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
      margin-top: 40px;
    }

    .tool {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 32px 20px 28px;
      background: #ffffff;
      border: 1px solid #e6e1d8;
      border-radius: 32px;
      box-shadow: 0 12px 35px rgba(50, 42, 30, 0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .tool::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -60px;
      bottom: -60px;
      border-radius: 50%;
      background: rgba(184, 135, 70, 0.08);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .tool:hover {
      transform: translateY(-6px);
      border-color: #d4bd9c;
      box-shadow: 0 18px 42px rgba(50, 42, 30, 0.13);
    }

    .tool:hover::after {
      transform: scale(1.25);
    }

    .icon {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: #faf8f3;
      border: 1px solid #eee8dd;
      overflow: hidden;
      margin-bottom: 28px;
      flex-shrink: 0;
    }

    .icon img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    .icon-fallback {
      font-size: 80px;
      line-height: 1;
    }

    .tool-name {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* Folder badge indicator */
    .tool.folder .icon {
      position: relative;
    }
    .tool.folder .icon::after {
      content: "";
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #b88746;
      box-shadow: 0 0 0 3px #faf8f3;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #a09a91;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    /* Folder modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(40, 33, 22, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-panel {
      width: min(720px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: #fffdf8;
      border-radius: 28px;
      border: 1px solid #e6e1d8;
      box-shadow: 0 24px 60px rgba(30, 24, 15, 0.25);
      padding: 32px 28px 36px;
      animation: modal-pop 0.18s ease;
    }

    @keyframes modal-pop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .modal-close {
      background: #f2ede2;
      border: 1px solid #e6e1d8;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      line-height: 1;
      color: #6b6357;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .modal-close:hover {
      background: #e6e1d8;
    }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 18px;
    }

    .folder-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      padding: 16px 10px;
      border-radius: 20px;
      border: 1px solid #eee8dd;
      background: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .folder-item:hover {
      transform: translateY(-3px);
      border-color: #d4bd9c;
      box-shadow: 0 10px 24px rgba(50, 42, 30, 0.1);
    }

    .folder-item-icon {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      background: #faf8f3;
      border: 1px solid #eee8dd;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .folder-item-icon img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
    }

    .folder-item-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }
      .tools {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .tool {
        min-height: 240px;
        padding: 28px 16px 24px;
      }
      .icon {
        width: 120px;
        height: 120px;
      }
      .icon img {
        width: 100px;
        height: 100px;
      }
      .icon-fallback {
        font-size: 66px;
      }
      .tool-name {
        font-size: 22px;
      }
      header {
        margin-bottom: 32px;
      }
      h1 {
        font-size: 36px;
      }
      .subtitle {
        font-size: 14px;
      }
      .modal-panel {
        padding: 24px 18px 28px;
      }
    }
  </style>
</head>

  function openFolder(id) {
